---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: mindwtr-front-http
  namespace: mindwtr

spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`mindwtr.agrrh.com`)
      middlewares:
        - name: whitelist
          namespace: kube-system
      services:
        - kind: Service
          name: front
          namespace: mindwtr
          port: http
