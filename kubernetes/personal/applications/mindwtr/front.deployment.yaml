---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: front
  namespace: mindwtr
  labels:
    app: mindwtr
    component: front

spec:
  replicas: 1
  selector:
    matchLabels:
      app: mindwtr
      component: front
  template:
    metadata:
      labels:
        app: mindwtr
        component: front
    spec:
      containers:
        - name: front
          image: ghcr.io/dongdongbh/mindwtr-app:1.3.8
          ports:
            - name: http
              containerPort: 5173
