---

kind: Application
apiVersion: argoproj.io/v1alpha1

metadata:
  name: metabase-postgres
  namespace: argocd

spec:
  project: personal

  destination:
    name: funny-bell
    namespace: db-personal

  source:
    repoURL: https://groundhog2k.github.io/helm-charts/
    chart: postgres
    targetRevision: "0.4.1"
    helm:
      releaseName: postgres
      values: |
        settings:
          existingSecret: provision
          superuser:
            secretKey: user
          superuserPassword:
            secretKey: password

        storage:
          className: local-path
          requestedSize: 10Gi
          accessModes:
            - ReadWriteOnce

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: false
      prune: false
