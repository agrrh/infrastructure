---

apiVersion: apps/v1
kind: Deployment

metadata:
  name: tools
  namespace: tools
  labels:
    app: tools

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tools
  template:
    metadata:
      labels:
        app: tools
    spec:
      containers:
        - name: main

          # NOTE: Original image
          # image: corentinth/it-tools:2024.5.13-a0bc346
          # NOTE: Most advanced fork found
          image: sharevb/it-tools:2026.9.27

          env:
            - name: FOO
              value: bar

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 64Mi

          ports:
            - name: http
              containerPort: 8080
