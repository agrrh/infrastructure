---

kind: Application
apiVersion: argoproj.io/v1alpha1

metadata:
  name: metabase
  namespace: argocd

spec:
  project: personal

  destination:
    name: funny-bell
    namespace: metabase

  source:
    repoURL: https://pmint93.github.io/helm-charts/
    targetRevision: 2.27.2
    chart: metabase

    helm:
      releaseName: metabase
      values: |
        image:
          repository: metabase/metabase
          tag: v0.61.x

        timeZone: Europe/Moscow

        monitoring:
          enabled: true
          port: 9191
          serviceMonitor:
            enabled: false
            releaseLabel: kube-prometheus-stack

        ssl:
          enabled: false

        database:
          type: postgres

          existingSecret: postgres
          existingSecretDatabaseNameKey: database
          existingSecretUsernameKey: user
          existingSecretPasswordKey: password
          # existingSecretConnectionURIKey:
          existingSecretEncryptionKeyKey: encryptionKey
          existingSecretPortKey: port
          existingSecretHostKey: host

        password:
          complexity: strong
          length: 12

        resources:
          limits:
           cpu: 2000m
           memory: 1024Mi
          requests:
           cpu: 500m
           memory: 256Mi

        startupProbe:
          path: /api/health
          timeoutSeconds: 3
          failureThreshold: 120
          periodSeconds: 5

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: false
      prune: false
